name: Sync from amathziah
on:
  schedule:
    - cron: "0 */6 * * *"   # every 6 hours
  workflow_dispatch:         # "Run workflow" button
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - run: gh repo sync pugazhjs9/malaria-detection --branch main
        env:
          GH_TOKEN: ${{ github.token }}
